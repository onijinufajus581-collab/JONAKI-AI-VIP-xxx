
name: JONAKI AI APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          find . -maxdepth 4 -type f -iname "*.zip" \
            ! -path "./extracted/*" -print0 |
          while IFS= read -r -d '' file; do
            echo "Extracting: $file"
            unzip -oq "$file" -d extracted
          done

      - name: Locate Complete Android Project
        id: locate
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r -d '' settings; do
            DIR=$(dirname "$settings")

            if [ -d "$DIR/app/src/main" ] && \
               { [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; }; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              ! -path './.git/*' -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Complete Android project not found."
            echo "Files found:"
            find . -maxdepth 7 -type f | head -150
            exit 1
          fi

          echo "Found project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.locate.outputs.project_dir }}"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JONAKI-AI-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
          
